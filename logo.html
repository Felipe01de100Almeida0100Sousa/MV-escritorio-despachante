<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo CRDD - PA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1b2a; /* Fundo Azul Marinho */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 20px 40px;
    }

    /* Ícone de Águia desenhado com SVG */
    .eagle-icon {
      width: 120px;
      height: 120px;
      fill: #ffffff; /* Cor branca para o ícone */
    }

    /* Texto do Logotipo */
    .logo-text {
      color: #ffffff; /* Texto branco */
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: 2px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <!-- Ícone SVG de Águia -->
    <svg class="eagle-icon" viewBox="0 0 100 100">
      <!-- Círculo recortado/base da cabeça -->
      <path d="M 50,2 A 48,48 0 1,0 98,50 A 48,48 0 0,0 50,2 Z" fill="#ffffff"/>
      <!-- Recorte interno (formato do bico e olho/estrela) em azul-marinho -->
      <path d="M 50,22 C 30,22 15,38 10,58 C 18,50 30,42 45,45 C 55,47 62,38 70,48 C 76,52 75,60 70,65 C 62,73 52,70 48,82 C 45,90 48,96 50,98 A 48,48 0 0,0 98,50 C 98,28 75,22 50,22 Z" fill="#0d1b2a"/>
      <!-- Estrela branca dentro do detalhe da cabeça -->
      <polygon points="40,32 42,37 47,37 43,40 45,45 40,42 35,45 37,40 33,37 38,37" fill="#ffffff"/>
    </svg>

    <!-- Texto do Logo -->
    <h1 class="logo-text">CRDD - PA</h1>
  </div>

</body>
</html>
